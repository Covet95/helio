[package]
name = "switch-api-gui"
version = "0.1.0"
edition = "2021"
default-run = "Helio"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
switch-api = { path = "..", features = ["tauri-gui"] }
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.3"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"

# Utilities
dirs = "5.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
trash = "5.2"
walkdir = "2.5"

[features]
default = ["tauri-gui"]
custom-protocol = ["tauri/custom-protocol"]
tauri-gui = []

[lib]
name = "switch_api_gui_lib"
crate-type = ["staticlib", "cdylib", "lib"]

# Windows/macOS 安装后的主程序名均为 Helio（与 productName / mainBinaryName 对齐）
[[bin]]
name = "Helio"
path = "src/main.rs"
