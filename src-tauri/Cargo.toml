[package]
name = "switch-api-gui"
version = "0.2.6"
edition = "2021"
default-run = "Helio"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
switch-api = { path = "..", features = ["tauri-gui"] }
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.3"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["time"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"

# Utilities
dirs = "5.0"

# 日志。核心库已在 journal 崩溃恢复等关键路径埋了 tracing 调用，
# 但此前无人初始化 subscriber——所有日志被静默丢弃。桌面应用从 Finder/
# Explorer 启动时 stderr 不可见，因此必须落盘。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
trash = "5.2"
walkdir = "2.5"

[features]
default = ["tauri-gui"]
custom-protocol = ["tauri/custom-protocol"]
tauri-gui = []

[dev-dependencies]
tempfile = "3.10"

[lib]
name = "switch_api_gui_lib"
crate-type = ["staticlib", "cdylib", "lib"]

# Windows/macOS 安装后的主程序名均为 Helio（与 productName / mainBinaryName 对齐）
[[bin]]
name = "Helio"
path = "src/main.rs"
