[workspace]
members = [".", "src-tauri"]

[package]
name = "switch-api"
version = "0.1.2"
edition = "2021"
authors = ["Switch API Team"]
description = "智能 AI CLI 工具 API 配置切换器"
license = "MIT"

[lib]
name = "switch_api"
path = "src/lib.rs"

[[bin]]
name = "switch-api"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "color"] }
anyhow = "1.0"
thiserror = "1.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# File operations
tempfile = "3.10"
dirs = "5.0"

# Logging and output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"

# HTTP (probe / failover)
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"

[features]
tauri-gui = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
