[workspace]
members = [".", "src-tauri"]

[package]
name = "switch-api"
version = "0.2.6"
edition = "2021"
authors = ["Switch API Team"]
description = "Helio 桌面应用 API 配置管理核心库"
license = "MIT"

[lib]
name = "switch_api"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
# 格式保真的 TOML 编辑（保留注释/键序）；`toml` 仅用于值级读写。
toml_edit = "0.22"
# 格式保真的 YAML 编辑（保留注释）。serde_yaml 已 deprecated，仅保留作
# 值级回退，新代码走 yaml_edit。
yaml-edit = "0.3"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# File operations
tempfile = "3.10"
dirs = "5.0"

# Logging
tracing = "0.1"

# HTTP (probe / failover)
reqwest = { version = "0.12", features = ["json"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }

# Archive (skills backup)
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
tauri-gui = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
