[workspace]
members = [".", "src-tauri"]

[package]
name = "switch-api"
version = "0.1.0"
edition = "2021"
authors = ["Switch API Team"]
description = "智能 AI CLI 工具 API 配置切换器"
license = "MIT"

[[bin]]
name = "switch-api"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "color"] }
anyhow = "1.0"
thiserror = "1.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# File operations
tempfile = "3.10"
dirs = "5.0"

# Logging and output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
indicatif = "0.17"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
assert_fs = "1.1"
predicates = "3.1"
tempfile = "3.10"

[features]
gui = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
