# 推送 v* tag → GitHub Actions 跨平台打包并挂到同一 Release
#
# 用法（推荐）:
#   1. 改版本号：**四处都要改**
#      - Cargo.toml
#      - src-tauri/Cargo.toml
#      - src-tauri/tauri.conf.json
#      - gui/package.json
#      （verify job 会断言这四处与 tag 一致，漏改会直接失败）
#   2. git push origin main
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# 或：Actions → Release → Run workflow，填写 tag（如 vX.Y.Z）
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（如 vX.Y.Z）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 出厂门禁：不通过就不打包。
  #
  # 此前打 tag 即出安装包，**不跑任何 test / lint**——tag 可以指向没过 CI 的
  # commit，发错版本号也不会失败。这里补上两道闸：
  #   1. 全量测试（Rust 核心库 + src-tauri + 前端）；
  #   2. tag 与四处版本号一致性（历史上有过版本漂移）。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与四处版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          # 四处版本号必须与 tag 相同（漏改任一处都会在这里失败）。
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          GUI_CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          PKG_VERSION=$(jq -r '.version' gui/package.json)

          echo "tag=$TAG_VERSION cargo=$CARGO_VERSION gui-cargo=$GUI_CARGO_VERSION tauri=$TAURI_VERSION package=$PKG_VERSION"

          fail=0
          for pair in "Cargo.toml:$CARGO_VERSION" "src-tauri/Cargo.toml:$GUI_CARGO_VERSION" \
                      "src-tauri/tauri.conf.json:$TAURI_VERSION" "gui/package.json:$PKG_VERSION"; do
            file="${pair%%:*}"; actual="${pair##*:}"
            if [ "$actual" != "$TAG_VERSION" ]; then
              echo "::error::$file 版本号是 $actual，与 tag $TAG_VERSION 不一致"
              fail=1
            fi
          done
          exit $fail

      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> target"

      - name: Rust 测试
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: 前端测试与类型检查
        working-directory: gui
        run: |
          npm ci
          npm run type-check
          npm test

  publish:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          # macOS Intel
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          # Linux
          - platform: ubuntu-22.04
            rust_target: ""
            args: --bundles deb,appimage
          # Windows：只打 NSIS（不要 MSI，避免双桌面图标）
          - platform: windows-latest
            rust_target: ""
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      # 只用 ayatana；勿与 libappindicator3-dev 同装（会 Conflicts）
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Helio ${{ steps.meta.outputs.tag }}
          releaseBody: |
            ## Helio ${{ steps.meta.outputs.tag }}

            由 **GitHub Actions** 自动跨平台构建并上传。

            | 平台 | 产物 |
            |------|------|
            | **Windows** | NSIS `*-setup.exe`（推荐；勿与 MSI 叠装） |
            | **macOS** | `.dmg`（Apple Silicon `aarch64` + Intel `x86_64`） |
            | **Linux** | `.deb` / AppImage |

            ### macOS 安装注意

            当前 dmg **未** Apple 公证。若提示「已损坏」或无法打开，安装到应用程序后执行：

            ```bash
            xattr -cr /Applications/Helio.app
            ```

            或右键 Helio → 打开。

            ### 说明

            - 配置目录均相对**用户主目录**（Windows 即 `%USERPROFILE%\.claude` 等）
            - 源码与变更见对应 tag 的 commit 历史
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
